[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-action-classification"
version = "0.1.0"
description = "Leakage-audited, code-only PICKUP versus DELIVERY classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cai Qichong" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
courier-action = "courier_action.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
